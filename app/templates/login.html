{% extends "base.html" %}{% block title %}Entrar · Caopanheiro{% endblock %}
{% block content %}<section class="form-card login-form-card"><p class="eyebrow">Que bom ter você aqui</p><h1>Entrar</h1><p>Acesse sua conta para acompanhar cada encontro.</p><form method="post" class="compact-form"><label>E-mail<input type="email" name="email" value="{{ request.form.get('email', '') }}" autocomplete="email" required></label><label>Senha<input type="password" name="password" autocomplete="current-password" required></label><button class="button" type="submit"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Entrar</button></form><p>Não possui conta? <a class="text-link" href="{{ url_for('register') }}">Cadastre-se</a>.</p></section>{% endblock %}
