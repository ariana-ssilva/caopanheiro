<div class="profile-photo-field">
  <div class="profile-photo-preview">
    {% if g.user and g.user.photo_filename %}<img class="profile-current-photo" src="{{ url_for('static', filename='uploads/' ~ g.user.photo_filename) }}" alt="Foto de perfil atual">{% else %}<div class="profile-photo-placeholder" aria-hidden="true"><i class="fa-solid fa-user"></i></div>{% endif %}
    <img id="selected-photo-preview" class="selected-photo-preview profile-new-photo" alt="Prévia da nova foto de perfil" hidden>
  </div>
  <div class="profile-photo-controls"><label>Foto de perfil <small>(opcional)</small><input type="file" name="photo" data-photo-input accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" aria-describedby="profile-photo-help photo-preview-message"></label>
  <small id="profile-photo-help">JPG, PNG ou WEBP · até 5 MB. Você pode usar uma foto ou o logo da ONG.</small>
  <p id="photo-preview-message" role="status" aria-live="polite"></p>
  {% if g.user and g.user.photo_filename %}<label class="checkbox-label"><input type="checkbox" name="remove_photo"> Remover foto atual</label>{% endif %}</div>
</div>
